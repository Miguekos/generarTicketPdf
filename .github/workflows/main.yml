name: Build and Push Docker Image

on:
  push:
    branches:
      - generarpdfs

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Generate Tag
      id: generate-tag
      run: |
        echo "::set-output name=tag::$(git rev-parse --short HEAD)"

    # - name: 'Create env file'
    #   run: |
    #     echo "${{ secrets.ENV_FILE }}" > .env.production
    #     cat .env.production

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USER }}/generarpdfs-covnertpdf:${{ steps.generate-tag.outputs.tag }}

    - name: Print Tag
      run: |
        echo "The Docker image tag is: ${{ steps.generate-tag.outputs.tag }}"
